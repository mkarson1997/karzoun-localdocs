# SonarQube Cloud automatic-analysis scope for Karzoun LocalDocs.
# Keep production Swift, the package manifest, and GitHub Actions workflows
# in main-code analysis while classifying XCTest files as tests.
# No rule suppressions or security exclusions are configured here.
sonar.sources=Sources,Package.swift,.github/workflows
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
