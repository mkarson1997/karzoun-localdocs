name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  swift:
    name: Swift build and deterministic tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift toolchain
        run: swift --version

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      - name: Debug tests
        run: swift test --parallel

      - name: Release tests
        run: swift test -c release --parallel

      - name: Release build
        run: swift build -c release

  ci-gate:
    name: CI Gate
    if: always()
    needs: [swift]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SWIFT_RESULT: ${{ needs.swift.result }}

    steps:
      - name: Require Swift CI success
        run: test "$SWIFT_RESULT" = "success"
